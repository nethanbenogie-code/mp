<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phone Price Book</title>
<meta name="description" content="Cellphone price list with dealer price, SRP and margin.">
<meta name="theme-color" content="#0f1114">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one quiet ledger. Sticky tool header, then brands as serif-titled chapters with hairline rows; prices right-aligned in tabular figures. */
:root{
  --bg:#0f1114; --surface:#16191e; --raise:#1e2228; --line:#2a2f37;
  --fg:#ece7dc; --muted:#9b978d; --accent:#c8a66b; --accent-ink:#191307;
  --good:#86c4a0; --danger:#e58372;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f5f4f1; --surface:#ffffff; --raise:#eeece7; --line:#dbd7ce;
  --fg:#1b1d21; --muted:#6a665e; --accent:#86652a; --accent-ink:#ffffff;
  --good:#2c7a52; --danger:#b23f2e; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f5f4f1; --surface:#ffffff; --raise:#eeece7; --line:#dbd7ce;
  --fg:#1b1d21; --muted:#6a665e; --accent:#86652a; --accent-ink:#ffffff;
  --good:#2c7a52; --danger:#b23f2e; color-scheme:light }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 4px}
h1{font-family:var(--display);font-weight:600;font-size:24px;line-height:1;margin:0;letter-spacing:.01em}
h1 em{font-style:italic;color:var(--accent);font-weight:500}
.meta{color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.bar{display:flex;gap:8px}
.bar input[type=search]{flex:1 1 auto;min-width:0}
.fbtn{position:relative;flex:none;width:44px;padding:0;display:grid;place-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:40px}
.fbtn[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}
.fbtn.on::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:2px}
.tools select{flex:1 1 140px}
.field,.tools select,.tools input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px}
.tools select{flex:0 1 auto;max-width:100%}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:0 4px;min-height:40px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.chip small{font-weight:500;opacity:.7;margin-left:5px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.brand{margin-top:22px}
.brand h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;margin:0;display:flex;align-items:baseline;gap:12px;letter-spacing:.03em}
.brand h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
.brand h2 span{order:2;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.cat{margin:18px 0 2px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"info srp" "info dp" "info mg";column-gap:16px;row-gap:1px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer}
.row:hover{background:var(--surface)}
.info{grid-area:info;min-width:0}
.model{font-weight:600;overflow-wrap:anywhere}
.color{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere;text-transform:capitalize}
.note{display:inline-block;margin-top:6px;font-size:12px;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:2px 8px;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.num i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-right:6px}
.srp{grid-area:srp;font-weight:700;font-size:16px}
.dp{grid-area:dp;font-size:13px;color:var(--muted)}
.mg{grid-area:mg;font-size:12.5px;color:var(--good)}
.hide-dp .dp,.hide-dp .mg{display:none}
@media (min-width:760px){
  .row{grid-template-columns:minmax(0,1fr) 130px 140px 150px;grid-template-areas:"info dp srp mg";align-items:center}
  .dp{font-size:14px}
  .hide-dp .row{grid-template-columns:minmax(0,1fr) 140px;grid-template-areas:"info srp"}
}
.empty{margin-top:56px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:24px;font-weight:600;color:var(--fg);margin-bottom:4px}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:50%;font-size:30px;font-weight:500;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}

dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0;width:calc(100% - 32px);max-width:500px;max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
form{display:flex;flex-direction:column;gap:12px;padding:20px}
form h3{font-family:var(--display);font-size:26px;font-weight:600;margin:0 0 2px}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
label .field{font-size:15px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--bg);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.calc{font-size:13px;color:var(--good);min-height:1.4em;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-left:auto}
.btn.del{color:var(--danger);border-color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13.5px;max-width:calc(100% - 32px);z-index:20}
</style>

<div class="wrap" id="app">
  <div class="head">
    <h1>Phone <em>Price Book</em></h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div class="top">
    <div class="bar">
      <input class="field" type="search" id="q" placeholder="Search model, color, brand…" autocomplete="off">
      <button class="fbtn" type="button" id="fbtn" aria-expanded="false" aria-controls="tools" aria-label="Filters and options">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
    </div>
    <div class="tools" id="tools" hidden>
      <select id="fcat" aria-label="Category"><option value="">All categories</option></select>
      <select id="sort" aria-label="Sort">
        <option value="ord">List order</option>
        <option value="lo">SRP low to high</option>
        <option value="hi">SRP high to low</option>
        <option value="mg">Biggest margin</option>
        <option value="az">Model A–Z</option>
      </select>
      <label class="toggle" style="flex-direction:row;text-transform:none;letter-spacing:0;font-weight:500"><input type="checkbox" id="hidedp"> Hide dealer price</label>
      <button class="btn" type="button" id="backup">Backup</button>
      <button class="btn" type="button" id="restore">Restore</button>
      <input type="file" id="rfile" accept="application/json,.json" hidden>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="list"><div class="empty"><b>Opening the price book</b>Loading your items…</div></div>
</div>

<button class="fab" id="add" type="button" aria-label="Add item">+</button>

<dialog id="dlg">
  <form id="form">
    <h3 id="ftitle">Add item</h3>
    <div class="two">
      <label>Brand<input class="field" id="f-brand" list="dl-brand" required autocomplete="off"></label>
      <label>Category<input class="field" id="f-cat" list="dl-cat" required autocomplete="off"></label>
    </div>
    <label>Model<input class="field" id="f-model" required autocomplete="off"></label>
    <label>Colors<input class="field" id="f-color" autocomplete="off" placeholder="Black / Blue"></label>
    <div class="two">
      <label>Dealer price (DP)<input class="field" id="f-dp" type="number" inputmode="decimal" step="0.01" min="0" required></label>
      <label>SRP<input class="field" id="f-srp" type="number" inputmode="decimal" step="0.01" min="0" required></label>
    </div>
    <div class="calc" id="calc"></div>
    <label>Note<input class="field" id="f-note" autocomplete="off" placeholder="Freebies, launch date…"></label>
    <div class="acts">
      <button class="btn del" type="button" id="del" hidden>Delete</button>
      <button class="btn" type="button" id="cancel">Cancel</button>
      <button class="btn primary" type="submit" id="save">Save</button>
    </div>
  </form>
  <datalist id="dl-brand"></datalist><datalist id="dl-cat"></datalist>
</dialog>
<div class="toast" id="toast" hidden></div>

dp":27299,"srp":29999,"note":"","ord":603},{"id":"tcn04","brand":"TECNO","cat":"Smartphone","model":"CAMON SLIM 5G CN6 (8GB 256GB)","color":"B. RED / M. BLACK / R. PINK","dp":25479,"srp":27999,"note":"Start store selling: October 16, 2026","ord":604},{"id":"tcn05","brand":"TECNO","cat":"Smartphone","model":"KN3 SPARK GO 3 (4GB 64GB)","color":"F. WHITE / I. BLACK / T. GRAY","dp":6044,"srp":6499,"note":"","ord":605},{"id":"tcn06","brand":"TECNO","cat":"Smartphone","model":"KN3 SPARK GO 3 (4GB 128GB)","color":"A. PURPLE / F. WHITE / I. BLACK / T. GREY","dp":6974,"srp":7499,"note":"","ord":606},{"id":"tcn07","brand":"TECNO","cat":"Smartphone","model":"KN4 SPARK 50 (4GB 128GB)","color":"I. BLACK / N. TITANIUM","dp":8189,"srp":8999,"note":"","ord":607},{"id":"tcn08","brand":"TECNO","cat":"Smartphone","model":"KN4 SPARK 50 (4GB 256GB)","color":"A. PURPLE / D. ORANGE / I. BLACK / T. GREY","dp":9099,"srp":9999,"note":"","ord":608},{"id":"tcn09","brand":"TECNO","cat":"Smartphone","model":"KN8 SPARK 50 5G (4GB 128GB)","color":"C. GOLD / F. PURPLE / I. BLACK / T. GREY","dp":10009,"srp":10999,"note":"","ord":609},{"id":"tcn10","brand":"TECNO","cat":"Smartphone","model":"KN8 SPARK 50 5G (6GB 256GB)","color":"I. BLACK / T. GRAY","dp":11829,"srp":12999,"note":"","ord":610},{"id":"tcn11","brand":"TECNO","cat":"Smartphone","model":"KN8 SPARK 50 5G (8GB 256GB)","color":"I. BLACK / T. GRAY","dp":13649,"srp":14999,"note":"","ord":611},{"id":"tcn12","brand":"TECNO","cat":"Smartphone","model":"POVA CURVE 2 5G LK7K (8GB 256GB)","color":"M. SILVER / S. TITANIUM / M. PURPLE","dp":16379,"srp":17999,"note":"","ord":612},{"id":"tcn13","brand":"TECNO","cat":"Accessories","model":"OW02 FREEHEAR 2 BUNDLE","color":"PINK MAUVE / SKY BLACK","dp":1500,"srp":2999,"note":"","ord":613},{"id":"tcn14","brand":"TECNO","cat":"Accessories","model":"TSP-WN01 WATCH NEO BUNDLE","color":"BLACK","dp":1750,"srp":3499,"note":"","ord":614},{"id":"tcn15","brand":"TECNO","cat":"Accessories","model":"TSP-W03A WATCH 3 ACTIVE","color":"BLACK","dp":899,"srp":1499,"note":"","ord":615},{"id":"tcn16","brand":"TECNO","cat":"Tablet","model":"MEGAPAD 2 T1103 (6GB 128GB)","color":"LIGHT GREEN / SPACE GRAY","dp":15299,"srp":16999,"note":"","ord":616},{"id":"tcn17","brand":"TECNO","cat":"Tablet","model":"MEGAPAD 2 T1103 (8GB 256GB)","color":"LIGHT GREEN / SPACE GRAY / COSMIC ORANGE","dp":17999,"srp":19999,"note":"","ord":617},{"id":"tcn18","brand":"TECNO","cat":"Tablet","model":"MEGAPAD PRO T1201 (8GB 256GB)","color":"AURORA PURPLE / SKY GRAY","dp":16379,"srp":17999,"note":"","ord":618},{"id":"tcn19","brand":"TECNO","cat":"Tablet","model":"MEGAPAD SE 2 T1002 (4GB 128GB)","color":"DEEP GRAY / IRIS PURPLE / SANDY TITANIUM","dp":10799,"srp":11999,"note":"","ord":619},{"id":"tcn20","brand":"TECNO","cat":"Tablet","model":"MEGAPAD SE 2 T1002 (4GB 256GB)","color":"DEEP GRAY / IRIS PURPLE / SANDY TITANIUM","dp":12599,"srp":13999,"note":"","ord":620}];
  let items=[], state='loading', brand='', editId=null, delArmed=false, toastT=null;

  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
  const margin=it=>(Number(it.srp)||0)-(Number(it.dp)||0);
  const pct=it=>Number(it.srp)>0?(margin(it)/Number(it.srp)*100):0;
  const catRank=c=>{const i=CAT_ORDER.indexOf(c);return i<0?99:i};

  function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

  function render(){
    const list=$('list');
    if(state!=='ready'){
      list.innerHTML=state==='nodb'
        ?'<div class="empty"><b>Price book unavailable</b>Open this page while signed in to Claude to load your items.</div>'
        :'<div class="empty"><b>Opening the price book</b>Loading your items…</div>';
      $('meta').textContent=state==='nodb'?'Not connected':'Loading…';
      return;
    }
    const brands=[...new Set(items.map(i=>i.brand))].sort();
    const cats=[...new Set(items.map(i=>i.cat))].sort((a,b)=>catRank(a)-catRank(b)||a.localeCompare(b));
    if(brand&&!brands.includes(brand))brand='';

    $('chips').innerHTML=['',...brands].map(b=>{
      const n=b?items.filter(i=>i.brand===b).length:items.length;
      return `<button type="button" class="chip" data-b="${esc(b)}" aria-pressed="${b===brand}">${esc(b||'All')}<small>${n}</small></button>`}).join('');
    const fc=$('fcat'), cur=fc.value;
    fc.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
    fc.value=cats.includes(cur)?cur:'';
    $('dl-brand').innerHTML=brands.map(b=>`<option value="${esc(b)}">`).join('');
    $('dl-cat').innerHTML=[...new Set([...CAT_ORDER,...cats])].map(c=>`<option value="${esc(c)}">`).join('');

    const q=$('q').value.trim().toLowerCase(), sort=$('sort').value;
    let rows=items.filter(i=>(!brand||i.brand===brand)&&(!fc.value||i.cat===fc.value)&&
      (!q||[i.brand,i.cat,i.model,i.color,i.note].join(' ').toLowerCase().includes(q)));
    const cmp={ord:(a,b)=>(a.ord||0)-(b.ord||0),lo:(a,b)=>a.srp-b.srp,hi:(a,b)=>b.srp-a.srp,
      mg:(a,b)=>margin(b)-margin(a),az:(a,b)=>String(a.model).localeCompare(String(b.model))}[sort];
    rows.sort((a,b)=>String(a.brand).localeCompare(String(b.brand))||catRank(a.cat)-catRank(b.cat)||String(a.cat).localeCompare(String(b.cat))||cmp(a,b));

    $('meta').textContent=`${rows.length===items.length?items.length:rows.length+' of '+items.length} items · ${brands.length} brands`;
    if(!items.length){list.innerHTML='<div class="empty"><b>No items yet</b>Tap “Add item” to enter your first phone.</div>';return}
    if(!rows.length){list.innerHTML='<div class="empty"><b>Nothing matches</b>Try a different search or filter.</div>';return}

    let html='', lb=null, lc=null;
    for(const it of rows){
      if(it.brand!==lb){
        if(lb!==null)html+='</section>';
        const n=rows.filter(r=>r.brand===it.brand).length;
        html+=`<section class="brand"><h2>${esc(it.brand)}<span>${n} item${n>1?'s':''}</span></h2>`;lb=it.brand;lc=null}
      if(it.cat!==lc){html+=`<div class="cat">${esc(it.cat)}</div>`;lc=it.cat}
      const m=margin(it);
      html+=`<button type="button" class="row" data-id="${esc(it.id)}">
        <span class="info"><span class="model">${esc(it.model)}</span>
          ${it.color?`<div class="color">${esc(String(it.color).toLowerCase())}</div>`:''}
          ${it.note?`<span class="note">${esc(it.note)}</span>`:''}</span>
        <span class="num srp"><i>SRP</i>${peso(it.srp)}</span>
        <span class="num dp"><i>DP</i>${peso(it.dp)}</span>
        <span class="num mg">${m>=0?'+':''}${peso(m)} · ${pct(it).toFixed(1)}%</span>
      </button>`;
    }
    list.innerHTML=html+'</section>';
  }

  function calc(){
    const dp=parseFloat($('f-dp').value), srp=parseFloat($('f-srp').value);
    $('calc').textContent=(isFinite(dp)&&isFinite(srp))?`Margin ${peso(srp-dp)}${srp>0?' · '+((srp-dp)/srp*100).toFixed(1)+'% of SRP':''}`:'';
  }
  function openForm(it){
    editId=it?it.id:null; delArmed=false;
    $('ftitle').textContent=it?'Edit item':'Add item';
    $('f-brand').value=it?it.brand:(brand||'');
    $('f-cat').value=it?it.cat:($('fcat').value||'Smartphone');
    $('f-model').value=it?it.model:''; $('f-color').value=it?(it.color||''):'';
    $('f-dp').value=it?it.dp:''; $('f-srp').value=it?it.srp:''; $('f-note').value=it?(it.note||''):'';
    $('del').hidden=!it; $('del').textContent='Delete'; $('save').disabled=false;
    calc(); $('dlg').showModal();
  }

  $('form').addEventListener('submit',async e=>{
    e.preventDefault();
    const old=items.find(i=>i.id===editId);
    const data={brand:$('f-brand').value.trim().toUpperCase(),cat:$('f-cat').value.trim(),model:$('f-model').value.trim(),
      color:$('f-color').value.trim(),dp:parseFloat($('f-dp').value)||0,srp:parseFloat($('f-srp').value)||0,
      note:$('f-note').value.trim(),ord:old?(old.ord||0):Date.now()};
    $('save').disabled=true;
    try{
      if(editId){const i=items.findIndex(x=>x.id===editId);items[i]={id:editId,...data}}else items.push({id:'i'+Date.now().toString(36),...data});
      persist();render();
      $('dlg').close(); toast(editId?'Item updated':'Item added');
    }catch(err){$('save').disabled=false;toast('Could not save. This device’s storage may be full.')}
  });
  $('del').addEventListener('click',async()=>{
    if(!delArmed){delArmed=true;$('del').textContent='Tap again to delete';return}
    try{items=items.filter(x=>x.id!==editId);persist();render();$('dlg').close();toast('Item deleted')}
    catch(err){toast('Could not delete. This device’s storage may be full.')}
  });
  $('cancel').addEventListener('click',()=>$('dlg').close());
  $('f-dp').addEventListener('input',calc); $('f-srp').addEventListener('input',calc);
  $('add').addEventListener('click',()=>openForm(null));
  $('list').addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;const it=items.find(i=>i.id===r.dataset.id);if(it)openForm(it)});
  $('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;brand=c.dataset.b;render()});
  const fb=$('fbtn');
  const flag=()=>fb.classList.toggle('on',!!$('fcat').value||$('sort').value!=='ord'||$('hidedp').checked);
  fb.addEventListener('click',()=>{const o=$('tools').hidden;$('tools').hidden=!o;fb.setAttribute('aria-expanded',o)});
  $('fcat').addEventListener('change',flag);$('sort').addEventListener('change',flag);$('hidedp').addEventListener('change',flag);
  $('q').addEventListener('input',render); $('fcat').addEventListener('change',render); $('sort').addEventListener('change',render);

  const hd=$('hidedp');
  try{hd.checked=localStorage.getItem('hideDP')==='1'}catch(e){}
  const applyHide=()=>{$('app').classList.toggle('hide-dp',hd.checked);try{localStorage.setItem('hideDP',hd.checked?'1':'0')}catch(e){}};
  hd.addEventListener('change',applyHide); applyHide(); flag();

  function persist(){localStorage.setItem(KEY,JSON.stringify(items))}
  try{const raw=localStorage.getItem(KEY);items=raw?JSON.parse(raw):null}catch(e){items=null}
  if(!Array.isArray(items))items=SEED.map(x=>({...x}));
  state='ready';render();

  $('backup').addEventListener('click',()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,1)],{type:'application/json'}));
    a.download='phone-price-book-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Backup file saved');
  });
  $('restore').addEventListener('click',()=>$('rfile').click());
  $('rfile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const arr=JSON.parse(r.result);
        if(!Array.isArray(arr)||!arr.every(x=>x&&typeof x==='object'&&'model' in x))throw 0;
        items=arr.map((x,n)=>({id:String(x.id||'r'+n),brand:String(x.brand||'').toUpperCase(),cat:String(x.cat||''),model:String(x.model||''),
          color:String(x.color||''),dp:Number(x.dp)||0,srp:Number(x.srp)||0,note:String(x.note||''),ord:Number(x.ord)||n}));
        persist();render();toast('Restored '+items.length+' items');
      }catch(err){toast('That file is not a Phone Price Book backup.')}
      e.target.value='';
    };
    r.readAsText(f);
  });

  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
